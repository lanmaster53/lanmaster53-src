{% extends "page.html" %}
{% set title = 'Archive' %}
{% block html %}
{% for year, items in posts|groupby('date.year')|reverse %}
<h2>{{ year }}</h2>
<ul>
{% for post in items %}
    <li><a href="{{ post_url(post) }}">{{ post.title }}</a> <time datetime="{{ post.date.strftime('%Y-%m-%d') }}">{{ post.date.strftime('%b %-d') }}</time></li>
{% endfor %}
</ul>
{% endfor %}
{% endblock %}
