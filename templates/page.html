{% extends "layout.html" %}
{% set title = title or page.title %}

{% block content %}
<header class="page-header">
    <h1>{{ title }}</h1>
</header>
<div class="prose">
    {% if page %}
        {{ page.html|safe }}
    {% else %}
        {% block html %}{% endblock %}
    {% endif %}
</div>
{% endblock %}
