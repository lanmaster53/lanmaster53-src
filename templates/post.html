{% extends "layout.html" %}
{% set title = post.title %}
{% set description = post.summary %}
{% set og_type = 'article' %}

{% block content %}
<article>
    <header class="page-header">
        <h1>{{ post.title }}</h1>
        <time datetime="{{ post.date.strftime('%Y-%m-%d') }}">{{ post.date.strftime("%B %-d, %Y") }}</time>
    </header>
    <div class="prose">
        {{ post.html|safe }}
    </div>
</article>
{% endblock %}
