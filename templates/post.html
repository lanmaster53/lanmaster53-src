{% extends "layout.html" %}
{% set title = post.title %}
{% set description = post.summary %}
{% set og_type = 'article' %}

{% block banner %}
<h2>{{ post.title }}</h2>
<h5>{{ post.date.strftime("%A, %B %e, %Y") }}</h5>
{% endblock %}

{% block content %}
<div class="content">
    {{ post.html|safe }}
</div>
{% endblock %}
