{% extends "page.html" %}
{% set title = 'Drafts' %}
{% block html %}
{% for draft in drafts %}
    <p>
        <a href="{{ post_url(draft) }}">{{ draft.title }}</a><br>
        {{ draft.date.strftime("%B %e, %Y") }}<br>
        Tags: {{ ', '.join(draft.tags) }}
    </p>
{% endfor %}
{% endblock %}
